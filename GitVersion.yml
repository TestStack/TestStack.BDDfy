assembly-versioning-scheme: MajorMinorPatch
strategies:
- Mainline
branches:
  main:
    mode: ContinuousDeployment
    regex: ^main$
    is-release-branch: true
    increment: Minor

  develop:
    mode: ContinuousDeployment
    regex: ^develop$
    tag: beta
    increment: Minor

  other:
    mode: ContinuousDelivery
    regex: .*
    tag: beta
    increment: Patch
ignore:
  sha: []